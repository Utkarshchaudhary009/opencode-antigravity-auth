name: Trigger CodeRabbit Review

# Posts "@coderabbitai review" when a PR is created (or leaves draft state).
# Uses pull_request_target so the GITHUB_TOKEN can comment on fork PRs;
# safe because this workflow never checks out or executes PR code.
on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

concurrency:
  group: coderabbit-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request CodeRabbit review
        uses: actions/github-script@v7
        with:
          script: |
            // A draft PR fires both `opened` and `ready_for_review`; skip if the
            // workflow has already posted its exact trigger comment.
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              },
              (response, done) => {
                const found = response.data.some(
                  (c) => c.user?.type === 'Bot' && c.body?.trim() === '@coderabbitai review',
                );
                if (found) done();
                return response.data;
              },
            );
            if (comments.some(
              (c) => c.user?.type === 'Bot' && c.body?.trim() === '@coderabbitai review',
            )) {
              console.log('Review already requested; skipping duplicate comment.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@coderabbitai review'
            });
